<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H-POS</title>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Barcode+39+Text&display=swap" rel="stylesheet">
  <!-- Leaflet.js for interactive maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    /* Custom scrollbar for webkit browsers */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1; /* Light grey track */
    }
    ::-webkit-scrollbar-thumb {
      background: #a0aec0; /* Tailwind gray-500 */
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #718096; /* Tailwind gray-600 */
    }
    body {
      font-family: 'Inter', sans-serif; /* A common, clean sans-serif font */
    }
    /* Apply Tailwind's antialiased class globally if not done by body class */
    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    :root {
        --primary-color: #0ea5e9; /* Default: sky */
        --primary-color-dark: #0284c7; /* Default: sky-600 */
    }
    .barcode-font {
        font-family: 'Libre Barcode 39 Text', cursive;
        font-size: 3rem; /* Reduced font size to prevent overflow */
        line-height: 1;
        letter-spacing: 2px;
        white-space: nowrap; /* Prevent barcode from wrapping to a new line */
    }
    
    @media print {
        body, html {
            background: #fff; margin: 0; padding: 0;
        }
        body > *:not(.receipt-print-area):not(.barcode-print-area) {
            display: none !important;
        }
        .no-print {
            display: none !important;
        }
        /* Receipt Printing */
        .receipt-print-area {
            position: absolute !important; left: 0 !important; top: 0 !important;
            width: 100% !important; height: auto !important; display: block !important;
            overflow: visible !important; background: white !important; margin: 0 !important;
            padding: 0 !important; border: none !important; box-shadow: none !important;
            border-radius: 0 !important;
        }
        .receipt-container {
            width: 80mm; margin: 0 auto; padding: 10px 5px; font-family: 'Courier New', monospace;
            font-size: 10pt; color: #000;
        }
        .receipt-container * {
            font-size: 10pt; color: #000;
        }
        .receipt-container .receipt-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .receipt-container .receipt-header img {
            width: 48px;
            height: auto;
            flex-shrink: 0;
        }
        .receipt-container .receipt-header div {
            text-align: right;
            padding-left: 10px;
        }
        .receipt-container .receipt-header h1 {
            font-size: 11pt;
            font-weight: bold;
            line-height: 1.2;
        }
        .receipt-container .receipt-header p {
            font-size: 8pt;
            line-height: 1.2;
        }
        .receipt-container .header-info {
            font-size: 8pt;
            padding: 5px 0;
            margin: 8px 0;
        }
        .receipt-container .header-info div {
            display: flex;
            justify-content: space-between;
            line-height: 1.4;
        }
        .receipt-container table {
            width: 100%; border-collapse: collapse;
        }
        .receipt-container th, .receipt-container td {
            padding: 2px 0;
        }
        .receipt-container .items-table thead tr {
            border-top: 1px dashed #000; border-bottom: 1px dashed #000;
        }
         .receipt-container .items-table th { text-align: left; }
        .receipt-container .items-table tbody {
            border-bottom: 1px dashed #000;
        }
        .receipt-container .items-table tbody tr td { vertical-align: top; padding-bottom: 4px; }
        .receipt-container .summary-table { margin-top: 10px; }
        .receipt-container .summary-table td:last-child { text-align: right; }
        .receipt-container .qr-code-container { text-align: center; margin-top: 10px; }
        .receipt-container .footer-text { text-align: center; font-size: 8pt; margin-top: 10px; }
        .receipt-container:not(:last-child) {
            page-break-after: always;
        }

        /* Barcode Printing */
        .barcode-print-area {
            position: absolute !important; 
            left: 0 !important; 
            top: 0 !important;
            width: 100% !important; 
            height: 100% !important; 
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            background: white !important; 
            margin: 0 !important;
            padding: 0 !important; 
            border: none !important; 
            box-shadow: none !important;
            border-radius: 0 !important;
        }
        .barcode-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
    }
  </style>
<script type="importmap">
{

    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
    "@google/genai": "https://esm.sh/@google/genai",

  }
}
</script>

</head>

</html>
